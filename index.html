<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PK Royal</title>
  <style>
    body {
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 5px;
    }

    #winnerAnnounce {
      font-size: 24px;
      font-weight: bold;
      color: #ffcb05;
      height: 35px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 203, 5, 0.4);
    }

    #topControls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      background: #2b2b36;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #2a75bb;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .speed-control input[type="range"] {
      width: 130px;
      cursor: pointer;
    }

    #setupMenu {
      background-color: #2b2b36;
      border: 2px solid #2a75bb;
      border-radius: 12px;
      padding: 15px 25px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .pokemon-option {
      display: flex;
      align-items: center;
      background: #1e1e24;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }

    .pokemon-option input {
      margin-right: 10px;
      transform: scale(1.2);
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 22px;
      font-size: 15px;
      font-weight: bold;
      background-color: #ffcb05;
      color: #2a75bb;
      border: 2px solid #2a75bb;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background-color: #ffe066;
    }

    button.secondary {
      background-color: #3a3a4a;
      color: #ffffff;
      border-color: #555566;
    }

    button.secondary:hover {
      background-color: #4a4a5a;
    }

    .main-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
    }

    canvas {
      background-color: #2b2b36;
      border: 5px solid #ffcb05;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .side-panel {
      background-color: #2b2b36;
      border: 2px solid #2a75bb;
      border-radius: 12px;
      padding: 15px;
      width: 440px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    .side-panel h3 {
      margin-top: 0;
      text-align: center;
      color: #ffcb05;
      border-bottom: 1px solid #2a75bb;
      padding-bottom: 8px;
    }

    #leaderboardList, #placementList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      font-size: 12px;
      border-bottom: 1px solid #3a3a4a;
    }

    .lb-name {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lb-dmg {
      color: #ff7675;
      font-weight: bold;
      margin-left: 5px;
    }

    .place-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      font-size: 12px;
      border-bottom: 1px solid #3a3a4a;
      border-radius: 4px;
      background: #1e1e24;
    }

    .place-item.alive {
      border-left: 3px solid #2ed573;
    }

    .place-item.dead {
      opacity: 0.5;
      border-left: 3px solid #ff4757;
    }

    .place-rank {
      font-weight: bold;
      width: 24px;
      color: #ffcb05;
      font-size: 11px;
    }

    .place-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <h1>PK Royal</h1>
  <div id="winnerAnnounce">Get Ready!</div>

  <div id="topControls">
    <button id="toggleMenuBtn" class="secondary" onclick="toggleMenu()">⚙️</button>
    <div class="speed-control">
      <span>Speed:</span>
      <input type="range" id="speedSlider" min="1.0" max="9.0" step="1.0" value="1.0" oninput="updateSpeedMultiplier(this.value)">
      <span id="speedVal">1.0x</span>
    </div>
  </div>

  <div id="setupMenu">
    <div style="font-weight: bold; text-align: center;">Get Ready!</div>
    <div class="pokemon-grid" id="pokemonSelectionList"></div>
    <div class="button-group">
      <button class="secondary" onclick="selectAll(true)">All</button>
      <button class="secondary" onclick="selectAll(false)">None</button>
      <button onclick="startSelectedMatch()">⚔️ GO!</button>
    </div>
  </div>

  <div class="main-container">
    <div id="placementPanel" class="side-panel">
      <h3>🏆 Placement</h3>
      <div id="placementList"></div>
    </div>

    <canvas id="arenaCanvas" width="750" height="750"></canvas>

    <div id="leaderboard" class="side-panel">
      <h3>📊 Damage Ranking</h3>
      <div id="leaderboardList"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. GRUNDEINSTELLUNGEN & VARIABLEN
    // ==========================================
    const canvas = document.getElementById("arenaCanvas");
    const ctx = canvas.getContext("2d");

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const initialArenaRadius = canvas.width / 2 - 12;
    let arenaRadius = initialArenaRadius;

    let waveAmplitude = 8;
    let waveFrequency = 6;
    let wavePhase = 0;

    let activeBumper = null;
    let speedMultiplier = 1.0;
    let battleTime = 0;
    let shrinkIntervalCount = 0;

    let activePokemons = [];
    let projectiles = [];
    let visualEffects = [];
    let scorchTrails = [];
    let leechSeeds = [];
    let matchStarted = false;
    let gameOver = false;
    let lastTime = 0;
    let eliminationOrder = [];

    // Event System Variablen
    let top10EventTriggered = false;
    let currentArenaBorderColor = "#ffcb05";
    let globalDamageMultiplier = 1.0;
    let hazardObjects = [];
    let hazardSpawnTimer = 0;
    let waterRiseHeight = 0; // Für Primordial Sea

    // ==========================================
    // 2. DATENBANK & TYPEN-FARBEN
    // ==========================================
    const typeColors = {
      burn: "#ff4757",        
      blitz: "#feca57",       
      slow_feld: "#48dbfb",   
      crit: "#ffffff",        
      curse_dot: "#a29bfe",   
      aoe_slam: "#747d8c",    
      snipe_shot: "#0984e3",  
      scorch: "#ff7f50",      
      barrier: "#ff9ff3",     
      leech_seed: "#2ed573",
      berserker: "#8b0000"
    };

    const possibleTypes = ["burn", "blitz", "slow_feld", "crit", "curse_dot", "aoe_slam", "snipe_shot", "scorch", "barrier", "leech_seed", "berserker"];

    const pokemonTemplates = [
      { name: "Panferno",       color: "#e25822", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.45, attackRange: 150, type: "burn", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/392.png" },
      { name: "Rotom",          color: "#f39c12", maxHp: 400, attack: 15, defense: 15, speed: 0.5, attackSpeed: 0.35, attackRange: 170, type: "blitz", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/479.png" },
      { name: "Rexblisar",      color: "#74b9ff", maxHp: 400, attack: 20, defense: 17, speed: 0.5, attackSpeed: 1.1, attackRange: 150, type: "slow_feld", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/460.png" },
      { name: "Impi",           color: "#8b0000", maxHp: 400, attack: 23, defense: 15, speed: 0.5, attackSpeed: 0.85, attackRange: 150, type: "berserker", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/160.png" },
      { name: "Nachtara",       color: "#6c5ce7", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.45, attackRange: 150, type: "curse_dot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/197.png" },
      { name: "Pikachu",        color: "#ffeaa7", maxHp: 400, attack: 15, defense: 15, speed: 0.5, attackSpeed: 0.35, attackRange: 170, type: "blitz", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" },
      { name: "Gengar",         color: "#a29bfe", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.45, attackRange: 150, type: "curse_dot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/94.png" },
      { name: "Arkani",         color: "#d63031", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.45, attackRange: 150, type: "burn", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/59.png" },
      { name: "Relaxo",         color: "#636e72", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.9, attackRange: 150, type: "aoe_slam", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png" },
      { name: "Tengulist",      color: "#2ed573", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 0.85, attackRange: 150, type: "crit", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/275.png" },
      { name: "Stolloss",       color: "#a4b0be", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.9, attackRange: 150, type: "aoe_slam", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/306.png" },
      { name: "Pelipper",       color: "#70a1ff", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.8, attackRange: 190, type: "snipe_shot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/279.png" },
      { name: "Rabigator",      color: "#ff6348", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.2, attackRange: 150, type: "scorch", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/553.png" },
      { name: "Zytomega",       color: "#1dd1a1", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.5, attackRange: 150, type: "barrier", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/579.png" },
      { name: "Fermicula",      color: "#57606f", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 0.85, attackRange: 150, type: "crit", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/632.png" },
      { name: "Brigaron",       color: "#10ac84", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.0, attackRange: 150, type: "leech_seed", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/652.png" },
      { name: "Fiaro",          color: "#ff4757", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.45, attackRange: 150, type: "burn", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/663.png" },
      { name: "Elezard",        color: "#eccc68", maxHp: 400, attack: 15, defense: 15, speed: 0.5, attackSpeed: 0.35, attackRange: 170, type: "blitz", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/695.png" },
      { name: "Durengard",      color: "#5f27cd", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.5, attackRange: 150, type: "barrier", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/681.png" },
      { name: "Silvarro",       color: "#009432", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.8, attackRange: 190, type: "snipe_shot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/724.png" },
      { name: "Curelei",        color: "#ff9ff3", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.0, attackRange: 150, type: "leech_seed", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/764.png" },
      { name: "Alola-Sandamer", color: "#48dbfb", maxHp: 400, attack: 20, defense: 17, speed: 0.5, attackSpeed: 1.1, attackRange: 150, type: "slow_feld", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/10102.png" },
      { name: "Krarmor",        color: "#341f97", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.9, attackRange: 150, type: "aoe_slam", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/823.png" },
      { name: "Lauchzelot",     color: "#f8c291", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 0.85, attackRange: 150, type: "crit", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/865.png" },
      { name: "Olangaar",       color: "#8395a7", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.5, attackRange: 150, type: "barrier", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/861.png" },
      { name: "Katapuldra",     color: "#00d2d3", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.8, attackRange: 190, type: "snipe_shot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/887.png" },
      { name: "Arceus",         color: "#c8d6e5", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.2, attackRange: 150, type: "scorch", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/493.png" },
      { name: "Pamomamo",       color: "#feca57", maxHp: 400, attack: 15, defense: 15, speed: 0.5, attackSpeed: 0.35, attackRange: 170, type: "blitz", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/923.png" },
      { name: "Saltigant",      color: "#ee5253", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.9, attackRange: 150, type: "aoe_slam", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/934.png" },
      { name: "Eisenbündel",    color: "#54a0ff", maxHp: 400, attack: 20, defense: 15, speed: 0.5, attackSpeed: 1.8, attackRange: 190, type: "snipe_shot", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/991.png" },
      { name: "Melmetal",       color: "#8b0000", maxHp: 400, attack: 23, defense: 15, speed: 0.5, attackSpeed: 0.85, attackRange: 150, type: "berserker", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/809.png" }
    ];

    // ==========================================
    // 3. ARENA & BUMPER FUNKTIONEN
    // ==========================================
    function getWavyRadius(angle) {
      return arenaRadius + Math.sin(angle * waveFrequency + wavePhase) * waveAmplitude;
    }

    function updateBumperPosition() {
      if (!activeBumper) return;
      const r = getWavyRadius(activeBumper.angle) - 15;
      activeBumper.x = centerX + Math.cos(activeBumper.angle) * r;
      activeBumper.y = centerY + Math.sin(activeBumper.angle) * r;
    }

    function spawnBumper() {
      const angle = Math.random() * Math.PI * 2;
      activeBumper = {
        angle: angle,
        radius: 18,
        x: 0,
        y: 0,
        pulseTimer: 0
      };
      updateBumperPosition();
    }

    function applyShrinkAndReshape() {
      arenaRadius *= 0.90;
      waveAmplitude = 6 + Math.random() * 8; 
      waveFrequency = Math.floor(4 + Math.random() * 6);
      wavePhase = Math.random() * Math.PI * 2;
      spawnBumper();
    }

    // ==========================================
    // 4. TOP 10 EVENT SYSTEM LOGIK
    // ==========================================
    let activeEventName = null;
    let eventTimer = 0; // Für zeitbasierte Event-Phasen (z.B. Unverwendbarkeit / Einfrieren)

    function triggerTop10Event() {
      top10EventTriggered = true;
      const roll = Math.random() * 100;
      
      if (roll < 50) {
        // Event 1: Classic (50%)
        activeEventName = "Classic";
        currentArenaBorderColor = "#ffcb05";
        document.getElementById("winnerAnnounce").innerText = "Event: Classic!";
      } else if (roll < 60) {
        // Event 2: Grassy Surge (10%)
        activeEventName = "Grassy Surge";
        currentArenaBorderColor = "#2ed573";
        document.getElementById("winnerAnnounce").innerText = "🌱 Grassy Surge Event!";
        visualEffects.push({ type: "circle_aoe", x: centerX, y: centerY, radius: initialArenaRadius, timer: 1.0, color: "rgba(46, 213, 115, 0.4)" });
        
        activePokemons.forEach(p => {
          if (p.hp > 0) {
            p.hp = Math.min(p.maxHp, p.hp + 200);
            // Debuffs entfernen (ausgenommen Berserker)
            p.dots = [];
            p.isSlowed = false;
            p.aoeDebuff = false;
            p.curseStacks = 0;
          }
        });
      } else if (roll < 70) {
        // Event 3: Harsh Sunlight (10%)
        activeEventName = "Harsh Sunlight";
        currentArenaBorderColor = "#ff4757";
        document.getElementById("winnerAnnounce").innerText = "☀️ Harsh Sunlight Event!";
        eventTimer = 10.0; // 10 Sekunden unverwendbar
      } else if (roll < 80) {
        // Event 4: Trick Room (10%)
        activeEventName = "Trick Room";
        currentArenaBorderColor = "#ff9ff3";
        document.getElementById("winnerAnnounce").innerText = "🌀 Trick Room Event!";
        
        activePokemons.forEach(p => {
          if (p.hp > 0) {
            p.baseSpeed *= 0.4; // 60% langsamer (behielt 40%)
          }
        });

        // Fähigkeiten zufällig neu verteilen unter den lebenden Pokémon
        const aliveList = activePokemons.filter(p => p.hp > 0);
        const typesPool = aliveList.map(p => p.type);
        // Mische den Pool durch
        typesPool.sort(() => Math.random() - 0.5);
        
        aliveList.forEach((p, idx) => {
          p.type = typesPool[idx];
          p.typeColor = typeColors[p.type] || p.color;
        });
      } else if (roll < 90) {
        // Event 5: Hazard Storm (10%)
        activeEventName = "Hazard Storm";
        currentArenaBorderColor = "#d35400";
        document.getElementById("winnerAnnounce").innerText = "🌪️ Hazard Storm Event!";
        hazardSpawnTimer = 0;
      } else {
        // Event 6: Primordial Sea (10%)
        activeEventName = "Primordial Sea";
        currentArenaBorderColor = "#2980b9";
        document.getElementById("winnerAnnounce").innerText = "🌊 Primordial Sea Event!";
        eventTimer = 10.0; // 10 Sekunden eingefroren
        waterRiseHeight = 0;
      }
    }

    // ==========================================
    // 5. KLASSEN (POKEMON & PROJEKTIL)
    // ==========================================
    class Pokemon {
      constructor(template, id) {
        this.id = id;
        this.name = template.name;
        this.color = template.color;
        this.typeColor = typeColors[template.type] || template.color;
        this.maxHp = template.maxHp;
        this.hp = template.maxHp;
        this.attack = template.attack;
        this.defense = template.defense;
        this.baseSpeed = template.speed;
        this.attackSpeed = template.attackSpeed;
        this.attackRange = template.attackRange;
        this.type = template.type;
        this.attackCooldown = 0;
        this.radius = 20;

        this.totalDamageDealt = 0;
        this.isSlowed = false;

        this.dots = [];
        this.curseStacks = 0;
        this.aoeDebuff = false;

        // Berserker Variablen
        this.berserkerActive = false;
        this.berserkerTimer = 0;
        this.berserkerTriggered = false;

        this.orbAngle = Math.random() * Math.PI * 2;
        this.orbHitCooldowns = new Map();

        this.slamCooldown = 0;
        this.seedDropCooldown = 0;

        this.imageLoaded = false;
        this.image = new Image();
        this.image.src = template.img;
        this.image.onload = () => { this.imageLoaded = true; };

        const angle = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * (arenaRadius - 50);
        this.x = centerX + r * Math.cos(angle);
        this.y = centerY + r * Math.sin(angle);

        const moveAngle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(moveAngle) * this.baseSpeed;
        this.vy = Math.sin(moveAngle) * this.baseSpeed;
      }

      applyDoT(type, duration, dps, attackerId = null) {
        if (type === "curse") {
          this.curseStacks++;
          this.dots.push({ type: "curse_tick", duration: Infinity, dps: this.curseStacks * 1.0, attackerId });
          return;
        }
        this.dots.push({ type, duration, dps, attackerId });
      }

      update(deltaTime) {
        if (this.hp <= 0) return;

        // Event 3: Harsh Sunlight (erste 10 Sekunden unbeweglich/unverwendbar)
        if (activeEventName === "Harsh Sunlight" && eventTimer > 0) {
          return; 
        }

        // Event 6: Primordial Sea (erste 10 Sekunden eingefroren)
        if (activeEventName === "Primordial Sea" && eventTimer > 0) {
          return; 
        }
        
        if (this.type === "berserker") {
          if (!this.berserkerTriggered && this.hp <= 100) {
            this.berserkerTriggered = true;
            this.berserkerActive = true;
            this.berserkerTimer = 20.0;
          }
          if (this.berserkerActive) {
            this.berserkerTimer -= deltaTime;
            if (this.berserkerTimer <= 0) {
              this.berserkerActive = false;
            }
          }
        }

        let effectiveSpeed = this.baseSpeed;
        if (this.berserkerActive) {
          effectiveSpeed *= 3.0;
        }
        this.isSlowed = false;

        // Spezialfähigkeit: Barrier
        if (this.type === "barrier") {
          this.orbAngle += 1.8 * deltaTime; 
          const orbDist = this.radius + 20;
          const orbRadius = 6;

          const orbPositions = [
            { x: this.x + Math.cos(this.orbAngle) * orbDist, y: this.y + Math.sin(this.orbAngle) * orbDist },
            { x: this.x + Math.cos(this.orbAngle + Math.PI) * orbDist, y: this.y + Math.sin(this.orbAngle + Math.PI) * orbDist }
          ];

          this.orbHitCooldowns.forEach((cd, key) => {
            if (cd > 0) this.orbHitCooldowns.set(key, cd - deltaTime);
          });

          activePokemons.forEach(other => {
            if (other !== this && other.hp > 0) {
              for (let orb of orbPositions) {
                if (Math.hypot(other.x - orb.x, other.y - orb.y) <= other.radius + orbRadius) {
                  const currentCd = this.orbHitCooldowns.get(other.id) || 0;
                  if (currentCd <= 0) {
                    const baseDmg = Math.max(3, this.attack * 1.0 * globalDamageMultiplier);
                    other.takeDamage(baseDmg, this.id);

                    let kx = other.x - this.x;
                    let ky = other.y - this.y;
                    let kDist = Math.hypot(kx, ky) || 1;
                    const knockbackDist = 25;

                    other.x += (kx / kDist) * knockbackDist;
                    other.y += (ky / kDist) * knockbackDist;

                    this.orbHitCooldowns.set(other.id, 0.5);
                  }
                }
              }
            }
          });
        }

        // Spezialfähigkeit: AoE Slam
        if (this.type === "aoe_slam") {
          if (this.slamCooldown > 0) {
            this.slamCooldown -= deltaTime;
          } else {
            this.triggerAoeSlam();
            this.slamCooldown = 16.0 / this.attackSpeed;
          }
        }

        // Spezialfähigkeit: Leech Seed
        if (this.type === "leech_seed") {
          if (this.seedDropCooldown > 0) {
            this.seedDropCooldown -= deltaTime;
          } else {
            let vLen = Math.hypot(this.vx, this.vy) || 1;
            const dropX = this.x - (this.vx / vLen) * (this.radius + 18);
            const dropY = this.y - (this.vy / vLen) * (this.radius + 18);

            leechSeeds.push({
              x: dropX,
              y: dropY,
              radius: 8,
              ownerId: this.id
            });
            this.seedDropCooldown = 8.0 / this.attackSpeed;
          }
        }

        // Spezialfähigkeit: Slow Feld
        activePokemons.forEach(other => {
          if (other.type === "slow_feld" && other.hp > 0 && other !== this) {
            const dist = Math.hypot(other.x - this.x, other.y - this.y);
            if (dist <= 160) {
              effectiveSpeed *= 0.35;
              this.isSlowed = true;
              this.takeDamage(2.9 * deltaTime, other.id);
            }
          }
        });

        // Spezialfähigkeit: Scorch Trail Damage
        scorchTrails.forEach(trail => {
          if (trail.ownerId !== this.id) {
            const dist = Math.hypot(trail.x - this.x, trail.y - this.y);
            if (dist < trail.radius) {
              this.takeDamage(1.8 * deltaTime, trail.ownerId);
            }
          }
        });

        if (this.type === "scorch") {
          scorchTrails.push({
            x: this.x,
            y: this.y,
            radius: 20,
            timer: 4.5,
            ownerId: this.id
          });
        }

        // Status-Effekte (inkl. Curse) abarbeiten
        for (let i = this.dots.length - 1; i >= 0; i--) {
          const dot = this.dots[i];
          if (dot.type !== "curse_tick") {
            dot.duration -= deltaTime;
          }
          
          let currentDps = dot.dps;
          if (dot.type === "curse_tick") {
            currentDps = this.curseStacks * 1.0;
          }

          this.takeDamage(currentDps * deltaTime, dot.attackerId);

          if (dot.type === "leech" && dot.attackerId !== null) {
            const attacker = activePokemons.find(p => p.id === dot.attackerId);
            if (attacker && attacker.hp > 0) {
              attacker.hp = Math.min(attacker.maxHp, attacker.hp + (currentDps * 0.6) * deltaTime);
            }
          }

          if (dot.type !== "curse_tick" && dot.duration <= 0) {
            this.dots.splice(i, 1);
          }
        }

        // Bewegung ausführen
        const currentVx = (this.vx / this.baseSpeed) * effectiveSpeed * speedMultiplier;
        const currentVy = (this.vy / this.baseSpeed) * effectiveSpeed * speedMultiplier;
        this.x += currentVx;
        this.y += currentVy;

        // Bumper-Kollision
        if (activeBumper) {
          const bDist = Math.hypot(this.x - activeBumper.x, this.y - activeBumper.y);
          if (bDist <= this.radius + activeBumper.radius) {
            let bx = this.x - activeBumper.x;
            let by = this.y - activeBumper.y;
            let bLen = Math.hypot(bx, by) || 1;
            
            const bumpImpulse = 1.3;
            this.vx = (bx / bLen) * this.baseSpeed * bumpImpulse;
            this.vy = (by / bLen) * this.baseSpeed * bumpImpulse;

            this.x = activeBumper.x + (bx / bLen) * (this.radius + activeBumper.radius + 2);
            activeBumper.pulseTimer = 0.25;
          }
        }

        // Wand-Kollision & Wasserstand-Prüfung (Primordial Sea)
        const dx = this.x - centerX;
        const dy = this.y - centerY;
        const distanceToCenter = Math.sqrt(dx * dx + dy * dy);
        const currentAngle = Math.atan2(dy, dx);
        const maxRadius = getWavyRadius(currentAngle);

        // Primordial Sea Wasserstand-Check: Y-Koordinate relativ zum Canvas-Zentrum im unteren Bereich
        if (activeEventName === "Primordial Sea" && eventTimer <= 0) {
          // Wasser steigt von unten nach oben (Y wächst nach unten)
          const waterLineY = centerY + initialArenaRadius - waterRiseHeight;
          if (this.y >= waterLineY) {
            this.hp = 0;
            eliminationOrder.push(this);
            return;
          }
        }

        if (distanceToCenter + this.radius > maxRadius) {
          const deltaA = 0.01;
          const r1 = getWavyRadius(currentAngle - deltaA);
          const r2 = getWavyRadius(currentAngle + deltaA);
          const dr = (r2 - r1) / (2 * deltaA);

          let nx = Math.cos(currentAngle) - (dr / maxRadius) * Math.sin(currentAngle);
          let ny = Math.sin(currentAngle) + (dr / maxRadius) * Math.cos(currentAngle);
          const nLen = Math.hypot(nx, ny) || 1;
          nx /= nLen;
          ny /= nLen;

          const dot = this.vx * nx + this.vy * ny;
          if (dot > 0) {
            this.vx -= 2 * dot * nx;
            this.vy -= 2 * dot * ny;
          }

          const currentLen = Math.hypot(this.vx, this.vy) || 1;
          this.vx = (this.vx / currentLen) * this.baseSpeed;
          this.vy = (this.vy / currentLen) * this.baseSpeed;

          const correctedRadius = maxRadius - this.radius - 1;
          this.x = centerX + Math.cos(currentAngle) * correctedRadius;
          this.y = centerY + Math.sin(currentAngle) * correctedRadius;
        }

      
        if (this.attackCooldown > 0) {
          this.attackCooldown -= deltaTime;
        } else {
          const target = this.findNearestEnemy();
          if (target) {
            this.attackEnemy(target);
            let effectiveAttackSpeed = this.attackSpeed;
            if (this.berserkerActive) {
              effectiveAttackSpeed /= 2.0; 
            }
            this.attackCooldown = effectiveAttackSpeed;
          }
        }
      }

      findNearestEnemy() {
        let nearest = null;
        let minDist = Infinity;
        activePokemons.forEach(enemy => {
          if (enemy !== this && enemy.hp > 0) {
            const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
            if (dist <= this.attackRange && dist < minDist) {
              minDist = dist;
              nearest = enemy;
            }
          }
        });
        return nearest;
      }

      triggerAoeSlam() {
        const slamRadius = 170;
        let baseDmg = Math.max(3, this.attack) * 1.0 * globalDamageMultiplier;
        if (this.aoeDebuff) baseDmg *= 0.70;

        visualEffects.push({ type: "circle_aoe", x: this.x, y: this.y, radius: slamRadius, timer: 0.5 });

        activePokemons.forEach(p => {
          if (p.hp > 0 && p !== this && Math.hypot(p.x - this.x, p.y - this.y) <= slamRadius) {
            p.takeDamage(baseDmg, this.id);
          }
        });
      }

      attackEnemy(target) {
        let rawDmg = Math.max(3, this.attack - Math.floor(target.defense / 2)) * globalDamageMultiplier;
        if (this.aoeDebuff) rawDmg *= 0.70;

        if (this.type === "snipe_shot") {
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const angle = Math.atan2(dy, dx);
          const endX = this.x + Math.cos(angle) * arenaRadius * 2;
          const endY = this.y + Math.sin(angle) * arenaRadius * 2;

          visualEffects.push({ type: "piercing_laser", x1: this.x, y1: this.y, x2: endX, y2: endY, timer: 0.25 });

          activePokemons.forEach(p => {
            if (p.hp > 0 && p !== this) {
              const distToLine = distanceToSegment({ x: p.x, y: p.y }, { x: this.x, y: this.y }, { x: endX, y: endY });
              if (distToLine <= p.radius + 8) {
                p.takeDamage(rawDmg * 1.5, this.id);
                if (this.berserkerActive) {
                  this.hp = Math.min(this.maxHp, this.hp + (rawDmg * 1.5) * 0.10);
                }
              }
            }
          });
        } else {
          projectiles.push(new Projectile(this.x, this.y, target, this.typeColor, rawDmg, this.type, this.id, this.berserkerActive));
        }
      }

      takeDamage(amount, attackerId = null) {
        if (amount <= 0 || this.hp <= 0) return;
        this.hp -= amount;

        if (attackerId !== null && amount > 0) {
          const attacker = activePokemons.find(p => p.id === attackerId);
          if (attacker) attacker.totalDamageDealt += amount;
        }

        if (this.hp <= 0) {
          this.hp = 0;
          eliminationOrder.push(this);
        }
      }

      draw() {
        if (this.hp <= 0) return;

        // Berserker Umleuchtung / Glow Effekt
        if (this.berserkerActive) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(139, 0, 0, 0.5)"; // Kastanienbraun / Dunkelrot
          ctx.fill();
        }

        if (this.type === "slow_feld") {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 130, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(72, 219, 251, 0.12)";
          ctx.fill();
        }

        if (this.type === "barrier") {
          const orbDist = this.radius + 15;
          const orbRadius = 6;
          for (let i = 0; i < 2; i++) {
            const angleOffset = i * Math.PI;
            const ox = this.x + Math.cos(this.orbAngle + angleOffset) * orbDist;
            const oy = this.y + Math.sin(this.orbAngle + angleOffset) * orbDist;

            ctx.beginPath();
            ctx.arc(ox, oy, orbRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff9ff3";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }

        if (this.imageLoaded) {
          ctx.drawImage(this.image, this.x - 22, this.y - 22, 44, 44);
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }

        if (this.curseStacks > 0) {
          ctx.fillStyle = "#a29bfe";
          ctx.font = "bold 11px Arial";
          ctx.fillText("💀" + this.curseStacks, this.x + 18, this.y - 5);
        }

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(this.name, this.x, this.y - this.radius - 8);

        const barWidth = 36;
        const barHeight = 5;
        const hpPercent = this.hp / this.maxHp;

        ctx.fillStyle = "#cc0000";
        ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 5, barWidth, barHeight);
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 5, barWidth * hpPercent, barHeight);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.strokeRect(this.x - barWidth / 2, this.y - this.radius - 5, barWidth, barHeight);

        let statusIcons = "";
        if (this.dots.some(d => d.type === "burn")) statusIcons += "🔥";
        if (this.isSlowed) statusIcons += "❄️";
        if (this.dots.some(d => d.type === "leech")) statusIcons += "🌱";
        if (this.aoeDebuff) statusIcons += "🏳️";
        if (this.berserkerActive) statusIcons += "💢";

        if (statusIcons !== "") {
          ctx.font = "12px Arial";
          ctx.textAlign = "left";
          ctx.fillText(statusIcons, this.x + barWidth / 2 + 3, this.y - this.radius);
        }
      }
    }

    class Projectile {
      constructor(x, y, target, color, damage, specialType, shooterId, isBerserk = false) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.color = color;
        this.damage = damage;
        this.specialType = specialType;
        this.shooterId = shooterId;
        this.isBerserk = isBerserk;
        this.baseSpeed = 5.0;
        this.radius = 4;
        this.hit = false;
        this.targetX = target.x;
        this.targetY = target.y;
        this.angle = Math.atan2(target.y - y, target.x - x);
      }

      update() {
        if (!this.target) {
          this.hit = true;
          return;
        }

        const tx = (this.target && this.target.hp > 0) ? this.target.x : this.targetX;
        const ty = (this.target && this.target.hp > 0) ? this.target.y : this.targetY;

        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0.001) this.angle = Math.atan2(dy, dx);

        const currentSpeed = this.baseSpeed * speedMultiplier;
        if (dist < currentSpeed) {
          this.applyImpact();
          this.hit = true;
        } else {
          this.x += (dx / dist) * currentSpeed;
          this.y += (dy / dist) * currentSpeed;
        }
      }

      applyImpact() {
        if (this.target && this.target.hp > 0) {
          let finalDmg = this.damage;

          if (this.specialType === "crit" && Math.random() < 0.33) {
            finalDmg *= 2.5;
            visualEffects.push({ type: "crit_text", x: this.target.x, y: this.target.y - 15, timer: 0.5, text: "CRIT!" });
          }

          this.target.takeDamage(finalDmg, this.shooterId);

          // Life Steal Verteilung für Berserker
          if (this.isBerserk) {
            const shooter = activePokemons.find(p => p.id === this.shooterId);
            if (shooter && shooter.hp > 0) {
              shooter.hp = Math.min(shooter.maxHp, shooter.hp + finalDmg * 0.25);
            }
          }

          if (this.specialType === "burn") this.target.applyDoT("burn", 7.5, 5, this.shooterId);
          if (this.specialType === "curse_dot") this.target.applyDoT("curse", 0, 0, this.shooterId);
          if (this.specialType === "aoe_slam" && this.target.type !== "aoe_slam") {
            this.target.aoeDebuff = true;
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.specialType === "crit") {
          ctx.beginPath();
          ctx.moveTo(-8, 0);
          ctx.lineTo(8, 0);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(3, -4);
          ctx.lineTo(9, 0);
          ctx.lineTo(3, 4);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // ==========================================
    // 5. HELFER & UI-STEUERUNG
    // ==========================================
    function distanceToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function updateSpeedMultiplier(val) {
      speedMultiplier = parseFloat(val);
      document.getElementById("speedVal").innerText = speedMultiplier.toFixed(1) + "x";
    }

    function toggleMenu() {
      const menu = document.getElementById("setupMenu");
      const btn = document.getElementById("toggleMenuBtn");
      if (menu.style.display === "none") {
        menu.style.display = "block";
        btn.innerText = "⚙️";
      } else {
        menu.style.display = "none";
        btn.innerText = "⚙️";
      }
    }

    function buildSelectionMenu() {
      const container = document.getElementById("pokemonSelectionList");
      container.innerHTML = "";
      pokemonTemplates.forEach((p, idx) => {
        const label = document.createElement("label");
        label.className = "pokemon-option";
        label.innerHTML = `<input type="checkbox" value="${idx}" checked> ${p.name}`;
        container.appendChild(label);
      });
    }

    function selectAll(check) {
      document.querySelectorAll("#pokemonSelectionList input").forEach(cb => cb.checked = check);
    }

    function updateLeaderboard() {
      const lbContainer = document.getElementById("leaderboardList");
      const sorted = [...activePokemons].sort((a, b) => b.totalDamageDealt - a.totalDamageDealt);

      lbContainer.innerHTML = "";
      sorted.forEach(p => {
        const item = document.createElement("div");
        item.className = "lb-item";
        item.innerHTML = `
          <span class="lb-name">
            <span style="display:inline-block; width:8px; height:8px; background:${p.typeColor}; border-radius:50%; flex-shrink:0;"></span>
            ${p.name}
          </span>
          <span class="lb-dmg">${Math.floor(p.totalDamageDealt)}</span>
        `;
        lbContainer.appendChild(item);
      });
    }

    function updatePlacementList() {
      const placementContainer = document.getElementById("placementList");
      const total = activePokemons.length;
      const alive = activePokemons.filter(p => p.hp > 0);
      const list = [];
      
      alive.forEach(p => list.push({ pokemon: p, isAlive: true }));
      for (let i = eliminationOrder.length - 1; i >= 0; i--) {
        list.push({ pokemon: eliminationOrder[i], isAlive: false, rank: total - i });
      }

      placementContainer.innerHTML = "";
      list.forEach((item) => {
        const rankText = item.isAlive ? (alive.length === 1 && eliminationOrder.length === total - 1 ? "#1" : "●") : `#${item.rank}`;
        const div = document.createElement("div");
        div.className = "place-item " + (item.isAlive ? "alive" : "dead");
        div.innerHTML = `
          <div class="place-info">
            <span class="place-rank">${rankText}</span>
            <span style="display:inline-block; width:8px; height:8px; background:${item.pokemon.typeColor}; border-radius:50%; flex-shrink:0;"></span>
            <span style="font-weight: bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.pokemon.name}</span>
          </div>
          <span style="font-size:11px; color:#aaa; margin-left:4px;">${item.isAlive ? Math.ceil(item.pokemon.hp) + "HP" : "K.O."}</span>
        `;
        placementContainer.appendChild(div);
      });
    }

    function startSelectedMatch() {
      const selectedIndices = Array.from(document.querySelectorAll("#pokemonSelectionList input:checked"))
                                   .map(cb => parseInt(cb.value));

      if (selectedIndices.length < 2) {
        alert("Select at least 2!");
        return;
      }

      arenaRadius = initialArenaRadius;
      battleTime = 0;
      shrinkIntervalCount = 0;
      waveAmplitude = 8;
      waveFrequency = 6;
      wavePhase = 0;

      // Event-System Reset
      top10EventTriggered = false;
      activeEventName = null;
      currentArenaBorderColor = "#ffcb05";
      globalDamageMultiplier = 1.0;
      hazardObjects = [];
      hazardSpawnTimer = 0;
      waterRiseHeight = 0;
      eventTimer = 0;

      spawnBumper();

      activePokemons = [];
      projectiles = [];
      visualEffects = [];
      scorchTrails = [];
      leechSeeds = [];
      eliminationOrder = [];
      gameOver = false;
      matchStarted = true;
      document.getElementById("winnerAnnounce").innerText = "Battling...";

      selectedIndices.forEach((idx, id) => {
        activePokemons.push(new Pokemon(pokemonTemplates[idx], id));
      });

      document.getElementById("setupMenu").style.display = "none";
      document.getElementById("toggleMenuBtn").innerText = "⚙️";
      updateLeaderboard();
      updatePlacementList();
    }

    // ==========================================
    // 6. RENDER- & SPIEL-SCHLEIFE
    // ==========================================
    function drawWavyArena() {
      ctx.beginPath();
      const steps = 180;
      for (let i = 0; i <= steps; i++) {
        const angle = (i / steps) * Math.PI * 2;
        const r = getWavyRadius(angle);
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = "#22222b";
      ctx.fill();

      // Wenn Primordial Sea aktiv, zeichne steigenden Wasserstand im Arena-Bereich
      if (activeEventName === "Primordial Sea" && eventTimer <= 0 && waterRiseHeight > 0) {
        ctx.save();
        ctx.clip(); // Clip auf die Arenagestalt
        ctx.fillStyle = "rgba(41, 128, 185, 0.5)";
        const waterY = centerY + initialArenaRadius - waterRiseHeight;
        ctx.fillRect(centerX - initialArenaRadius, waterY, initialArenaRadius * 2, initialArenaRadius * 2);
        ctx.restore();
      }

      ctx.strokeStyle = currentArenaBorderColor;
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    function drawBumper() {
      if (!activeBumper) return;
      if (activeBumper.pulseTimer > 0) activeBumper.pulseTimer -= 0.016 * speedMultiplier;

      ctx.save();
      ctx.translate(activeBumper.x, activeBumper.y);

      if (activeBumper.pulseTimer > 0) {
        ctx.beginPath();
        ctx.arc(0, 0, activeBumper.radius + 6, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 234, 167, 0.6)";
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, activeBumper.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff4757";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, activeBumper.radius * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffcb05";
      ctx.fill();

      ctx.restore();
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = ((timestamp - lastTime) / 1000) * speedMultiplier;
      lastTime = timestamp;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (matchStarted && !gameOver) {
        battleTime += deltaTime;
        const intervalsPassed = Math.floor(battleTime / 40);
        if (intervalsPassed > shrinkIntervalCount) {
          shrinkIntervalCount = intervalsPassed;
          applyShrinkAndReshape();
        }

        // Timer herunterzählen für Event-Phasen (z.B. Harsh Sunlight oder Primordial Sea Startphasen)
        if (eventTimer > 0) {
          eventTimer -= deltaTime;
          if (eventTimer <= 0) {
            if (activeEventName === "Harsh Sunlight") {
              globalDamageMultiplier = 1.20; // 20% Schadensbonus danach
              document.getElementById("winnerAnnounce").innerText = "Sunlight Over: +20% Damage!";
            } else if (activeEventName === "Primordial Sea") {
              document.getElementById("winnerAnnounce").innerText = "Water Rising!";
            }
          }
        }

        // Primordial Sea Wasserstand steigen lassen
        if (activeEventName === "Primordial Sea" && eventTimer <= 0) {
          waterRiseHeight += deltaTime * 2.0; // Steigt langsam an
        }

        // Hazard Storm: Spawne periodisch Steine oder Beeren
        if (activeEventName === "Hazard Storm") {
          hazardSpawnTimer += deltaTime;
          if (hazardSpawnTimer >= 4.0) {
            hazardSpawnTimer = 0;
            // Zufällige Position innerhalb der Arena
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (arenaRadius - 30);
            const hx = centerX + Math.cos(angle) * dist;
            const hy = centerY + Math.sin(angle) * dist;
            const isBerry = Math.random() < 0.5;
            hazardObjects.push({ x: hx, y: hy, type: isBerry ? "berry" : "stone", radius: 10, timer: 10.0 });
          }
        }

        // Top 10 Event Auslöser prüfen
        const aliveCount = activePokemons.filter(p => p.hp > 0).length;
        if (!top10EventTriggered && aliveCount <= 10 && aliveCount > 1) {
          triggerTop10Event();
        }
      }

      drawWavyArena();
      if (matchStarted) drawBumper();

      if (matchStarted) {
        // Hazard Objects verarbeiten und zeichnen
        for (let i = hazardObjects.length - 1; i >= 0; i--) {
          const h = hazardObjects[i];
          h.timer -= deltaTime;
          
          ctx.save();
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
          ctx.fillStyle = h.type === "berry" ? "#2ed573" : "#718093";
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = "#fff";
          ctx.font = "10px Arial";
          ctx.textAlign = "center";
          ctx.fillText(h.type === "berry" ? "🫐" : "🪨", h.x, h.y + 3);
          ctx.restore();

          // Kollision mit lebenden Pokémon prüfen
          for (let p of activePokemons) {
            if (p.hp > 0 && Math.hypot(p.x - h.x, p.y - h.y) <= p.radius + h.radius) {
              if (h.type === "berry") {
                p.hp = Math.min(p.maxHp, p.hp + 50);
              } else {
                p.takeDamage(40, null);
              }
              hazardObjects.splice(i, 1);
              break;
            }
          }

          if (i < hazardObjects.length && h.timer <= 0) {
            hazardObjects.splice(i, 1);
          }
        }

        // Scorch Trails verarbeiten
        for (let i = scorchTrails.length - 1; i >= 0; i--) {
          const trail = scorchTrails[i];
          trail.timer -= deltaTime;
          ctx.beginPath();
          ctx.arc(trail.x, trail.y, trail.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 127, 80, ${Math.min(0.4, trail.timer / 10.0 * 0.4)})`;
          ctx.fill();
          if (trail.timer <= 0) scorchTrails.splice(i, 1);
        }

        // Leech Seeds verarbeiten
        for (let i = leechSeeds.length - 1; i >= 0; i--) {
          const seed = leechSeeds[i];
          ctx.save();
          ctx.translate(seed.x, seed.y);
          
          ctx.beginPath();
          ctx.moveTo(0, -9);
          ctx.bezierCurveTo(7, -3, 8, 6, 0, 9);
          ctx.bezierCurveTo(-8, 6, -7, -3, 0, -9);
          ctx.fillStyle = "#2ed573";
          ctx.fill();
          ctx.strokeStyle = "#10ac84";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.lineTo(0, 5);
          ctx.strokeStyle = "#7bed9f";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();

          let seedHit = false;
          for (let p of activePokemons) {
            if (p.hp > 0 && Math.hypot(p.x - seed.x, p.y - seed.y) <= p.radius + seed.radius) {
              if (p.id === seed.ownerId) {
                p.hp = Math.min(p.maxHp, p.hp + 25);
              } else {
                p.takeDamage(50, seed.ownerId);
              }
              seedHit = true;
              break;
            }
          }
          if (seedHit) leechSeeds.splice(i, 1);
        }

        const alivePokemons = activePokemons.filter(p => p.hp > 0);
        if (alivePokemons.length <= 1 && !gameOver) {
          gameOver = true;
          const winnerAnnounce = document.getElementById("winnerAnnounce");
          winnerAnnounce.innerText = alivePokemons.length === 1 ? "🏆 " + alivePokemons[0].name + " wins!" : "Draw!";
          document.getElementById("setupMenu").style.display = "block";
          document.getElementById("toggleMenuBtn").innerText = "⚙️";
        }

        activePokemons.forEach(pokemon => {
          pokemon.update(deltaTime);
          pokemon.draw();
        });

        for (let i = projectiles.length - 1; i >= 0; i--) {
          const proj = projectiles[i];
          proj.update();
          proj.draw();
          if (proj.hit) projectiles.splice(i, 1);
        }

        for (let i = visualEffects.length - 1; i >= 0; i--) {
          const fx = visualEffects[i];
          fx.timer -= deltaTime;

          if (fx.type === "circle_aoe") {
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
            ctx.fillStyle = fx.color || "rgba(116, 125, 140, 0.5)";
            ctx.fill();
          } else if (fx.type === "piercing_laser") {
            ctx.strokeStyle = "rgba(9, 132, 227, 0.8)";
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(fx.x1, fx.y1);
            ctx.lineTo(fx.x2, fx.y2);
            ctx.stroke();
          } else if (fx.type === "crit_text") {
            ctx.fillStyle = "#ff4d4d";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.fillText(fx.text || "CRIT!", fx.x, fx.y);
          }

          if (fx.timer <= 0) visualEffects.splice(i, 1);
        }

        const mins = Math.floor(battleTime / 60).toString().padStart(2, '0');
        const secs = Math.floor(battleTime % 60).toString().padStart(2, '0');
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "right";
        ctx.fillText(`⏱️ ${mins}:${secs}`, canvas.width - 20, 30);

        updateLeaderboard();
        updatePlacementList();
      }

      requestAnimationFrame(gameLoop);
    }

    // Initialisierung starten
    buildSelectionMenu();
    requestAnimationFrame(gameLoop);
  </script>
